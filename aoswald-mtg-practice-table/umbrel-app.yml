manifestVersion: 1
id: aoswald-mtg-practice-table
name: MTG Practice Table
tagline: Practice Commander and run a shared MTG life table
icon: https://raw.githubusercontent.com/a0swald/mtg-practice-table/main/public/icon.png
category: Games
version: "0.3.4"
port: 3100
description: >-
  A self-hosted Magic: The Gathering practice and table utility app. Practice Commander games, use a mobile-first life counter, and create live Shared Tables that synchronize player life and state across devices in real time.
developer: Alex Oswald
website: https://mtgtable.duckdns.org
submitter: Alex Oswald
submission: https://github.com/a0swald/umbrel-community-app-store
repo: https://github.com/a0swald/mtg-practice-table
support: https://github.com/a0swald/mtg-practice-table/issues
releaseNotes: >-
  Rebuilds remote access as part of the main MTG container instead of a required Caddy sidecar. The app always boots normally through Umbrel, while bundled Caddy provides optional HTTPS ingress on host ports 18080 and 18443, restores saved DuckDNS configuration after restarts, and proxies Socket.IO. If Caddy cannot start, local MTG access remains available.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
